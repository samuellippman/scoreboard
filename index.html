<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoreboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      user-select: none;
    }

    #score {
      font-size: clamp(6rem, 25vw, 14rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: -0.02em;
      transition: color 0.15s, transform 0.1s;
    }

    #score.bump {
      transform: scale(0.94);
      color: #e05555;
    }

    .setup {
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }

    input[type="number"] {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      padding: 0.55rem 1rem;
      font-size: 1.1rem;
      border-radius: 8px;
      width: 110px;
      text-align: center;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: #555;
    }

    /* hide number input spinners */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type="number"] { -moz-appearance: textfield; }

    button {
      background: #222;
      border: 1px solid #444;
      color: #ccc;
      padding: 0.55rem 1.4rem;
      font-size: 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }

    button:hover {
      background: #2e2e2e;
      color: #fff;
    }

    .hint {
      color: #3a3a3a;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="setup">
    <input type="number" id="startInput" value="100" min="0">
    <button onclick="applyStart()">Set</button>
  </div>

  <div id="score">100</div>

  <div class="hint">Press a number key to subtract</div>

  <script>
    let score = 100;

    function applyStart() {
      const val = parseInt(document.getElementById('startInput').value, 10);
      if (!isNaN(val)) {
        score = val;
        render();
      }
    }

    function render() {
      document.getElementById('score').textContent = score;
    }

    document.addEventListener('keydown', (e) => {
      // ignore when typing in the input
      if (e.target.tagName === 'INPUT') return;

      if (e.key >= '0' && e.key <= '9') {
        score -= parseInt(e.key, 10);
        render();

        const el = document.getElementById('score');
        el.classList.remove('bump');
        void el.offsetWidth; // force reflow to restart animation
        el.classList.add('bump');
        setTimeout(() => el.classList.remove('bump'), 150);
      }

      // Enter from anywhere applies the start input
      if (e.key === 'Enter') applyStart();
    });
  </script>

</body>
</html>
